name: Verify Holo4 worker

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest aiohttp
      - run: python -m pytest -q tests
      - run: python -m compileall -q src handler.py
      - run: cmp handler.py src/handler.py
      - run: python -m json.tool .runpod/hub.json > /dev/null
      - run: python -m json.tool .runpod/tests.json > /dev/null
